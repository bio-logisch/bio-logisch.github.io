<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>도서 상세 · 팽샛별</title>
<style>
  :root{
    --paper:#FCFBF7; --ink:#2B2B2B; --ink-soft:#6C6A63; --line:rgba(43,43,43,.12);
    --coral:#F2543D; --yellow:#F6BE2C; --green:#54B24A; --magenta:#E94E9C; --teal:#2FB3A6; --purple:#8A5CD1;
    --radius:16px; --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--font); line-height:1.75; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; } img{ max-width:100%; display:block; }
  .wrap{ width:min(1080px,92vw); margin-inline:auto; }
  a:focus-visible,button:focus-visible{ outline:2px solid var(--coral); outline-offset:3px; border-radius:6px; }

  header{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:16px;
    padding:16px min(5vw,36px); background:color-mix(in srgb,var(--paper) 86%,transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .brand{ font-weight:800; display:flex; align-items:center; gap:8px; }
  .brand .dot{ width:12px; height:12px; border-radius:50%; background:var(--coral); box-shadow:16px 0 0 var(--yellow),-16px 0 0 var(--teal); margin-right:16px; }
  nav.n{ margin-left:auto; display:flex; gap:20px; align-items:center; font-size:.86rem; color:var(--ink-soft); }
  nav.n a:hover{ color:var(--coral); }
  .pill{ border:1.5px solid var(--ink); border-radius:999px; padding:5px 14px; font-weight:700; letter-spacing:.06em; font-size:.78rem; }
  .pill:hover{ background:var(--ink); color:#fff; }

  .crumb{ padding:26px 0 0; font-size:.85rem; color:var(--ink-soft); }
  .crumb a:hover{ color:var(--coral); }
  .detail{ display:grid; grid-template-columns:.85fr 1.15fr; gap:52px; padding:26px 0 80px; align-items:start; }
  .coverbox{ border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); box-shadow:0 20px 40px rgba(43,43,43,.16); }
  .coverbox img,.coverbox svg{ width:100%; display:block; }
  .series{ font-size:.74rem; letter-spacing:.1em; text-transform:uppercase; color:var(--magenta); font-weight:700; }
  h1{ font-size:clamp(1.8rem,4vw,2.6rem); margin:10px 0 6px; letter-spacing:-.01em; }
  .price{ font-size:1.6rem; font-weight:800; margin:18px 0; }
  .blurb{ color:var(--ink-soft); max-width:52ch; }
  .facts{ margin:22px 0; border-top:1px solid var(--line); }
  .facts div{ display:grid; grid-template-columns:120px 1fr; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-size:.92rem; }
  .facts .k{ color:var(--ink-soft); }
  .buys{ display:flex; gap:12px; margin-top:26px; flex-wrap:wrap; }
  .btn{ border:0; cursor:pointer; font-family:inherit; font-weight:800; letter-spacing:.03em; padding:15px 26px; border-radius:999px; font-size:1rem; }
  .btn.buy{ background:var(--coral); color:#fff; } .btn.buy:hover{ background:var(--magenta); }
  .btn.cart{ background:#fff; color:var(--ink); border:1.5px solid var(--ink); } .btn.cart:hover{ background:var(--ink); color:#fff; }
  .note{ margin-top:16px; font-size:.82rem; color:var(--ink-soft); }
  .back{ display:inline-block; margin-top:8px; font-weight:700; }
  .back:hover{ color:var(--coral); }
  footer{ border-top:1px solid var(--line); text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:.85rem; }
  @media (max-width:820px){ .detail{ grid-template-columns:1fr; gap:28px; } .coverbox{ max-width:320px; margin-inline:auto; } }
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html"><span class="dot"></span>팽샛별</a>
  <nav class="n">
    <a href="index.html">홈</a>
    <a class="pill" href="shop.html">SHOP</a>
    <a class="pill" href="edu.html">EDU</a>
  </nav>
</header>

<main class="wrap">
  <p class="crumb"><a href="shop.html">← 상점으로</a></p>
  <div class="detail" id="detail"><!-- JS로 채워집니다 --></div>
</main>

<footer>© 팽샛별 · 예시용 상세 페이지입니다. 실제 결제는 제공되지 않습니다.</footer>

<script>
const books=[
  {id:1,title:"여보세요?",series:"우리 동네 사람들 이야기",role:"글 · 그림",publisher:"위즈덤하우스",date:"2017. 11. 30.",pages:"48쪽",price:15000,image:"images/covers/hello.jpg",
   blurb:"실 전화기 너머로 이어지는 우리 동네 사람들의 다정한 안부. 서로를 살피는 마음을 노랑노랑한 색으로 그린 팽샛별의 첫 그림책입니다. 종이컵 두 개와 실 한 가닥이 이어 준 하루의 대화를 따라가다 보면, 이웃이라는 말이 조금 더 따뜻해집니다."},
  {id:2,title:"어떡하지?",series:"뚝딱뚝딱 우리책 7",role:"글 · 그림",publisher:"그림책공작소",date:"2017. 12. 26.",pages:"40쪽",price:14000,image:"images/covers/whatnow.jpg",
   blurb:"복도에서 뛸까 말까, 인사할까 말까 — 매일 새로운 고민 앞에 선 고은이. 망설임 끝에 스스로 결정하고 그 결정을 책임지는 아이의 하루를 담았습니다."},
  {id:3,title:"힘도 무선전송된다",series:"열린어린이 동시집 02",role:"그림",publisher:"열린어린이",date:"2016",pages:"128쪽",price:12000,image:"images/covers/power.jpg",
   blurb:"이중현 시인의 동시에 팽샛별이 그림을 얹었습니다. 운동장과 교실, 아이들의 씩씩한 하루가 통통 튀는 그림과 함께 펼쳐집니다."},
  {id:4,title:"실 전화기",series:"팽샛별 그림책",role:"글 · 그림",publisher:"(예시) 샛별책방",date:"2025",pages:"44쪽",price:15000,color:"var(--coral)",pat:"dots",
   blurb:"창과 창 사이를 잇는 노란 실 한 가닥. 멀리 있어도 마음은 이어진다는, 작고 따뜻한 이야기입니다. ※ 실제 출간물이 아닌 예시 도서입니다."},
  {id:5,title:"바느질하는 밤",series:"팽샛별 그림책",role:"글 · 그림",publisher:"(예시) 샛별책방",date:"2025",pages:"48쪽",price:16000,color:"var(--teal)",pat:"stripe",
   blurb:"엄마의 반짇고리에서 시작된 한밤의 모험. 단추와 실, 골무가 도란도란 이야기를 잇습니다. ※ 실제 출간물이 아닌 예시 도서입니다."},
  {id:6,title:"단추 마을",series:"팽샛별 그림책",role:"글 · 그림",publisher:"(예시) 샛별책방",date:"2025",pages:"40쪽",price:15000,color:"var(--magenta)",pat:"grid",
   blurb:"동그란 단추들이 사는 마을에 구멍 세 개짜리 낯선 단추가 찾아옵니다. 다름과 어울림에 대한 그림책. ※ 실제 출간물이 아닌 예시 도서입니다."},
];
function coverSVG(b){
  const pat = b.pat==='stripe'
    ? `<pattern id="p${b.id}" patternUnits="userSpaceOnUse" width="26" height="26" patternTransform="rotate(45)"><rect width="26" height="26" fill="${b.color}"/><rect width="13" height="26" fill="#ffffff33"/></pattern>`
    : b.pat==='grid'
    ? `<pattern id="p${b.id}" patternUnits="userSpaceOnUse" width="24" height="24"><rect width="24" height="24" fill="${b.color}"/><path d="M0 0H24M0 0V24" stroke="#ffffff44" stroke-width="2"/></pattern>`
    : `<pattern id="p${b.id}" patternUnits="userSpaceOnUse" width="26" height="26"><rect width="26" height="26" fill="${b.color}"/><circle cx="7" cy="7" r="3.4" fill="#ffffff55"/><circle cx="19" cy="19" r="3.4" fill="#ffffff55"/></pattern>`;
  return `<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg"><defs>${pat}</defs>
    <rect width="300" height="400" fill="url(#p${b.id})"/>
    <rect x="22" y="150" width="256" height="120" rx="10" fill="#ffffffee"/>
    <text x="150" y="205" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="30" font-weight="800" fill="#2B2B2B">${b.title}</text>
    <text x="150" y="240" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" letter-spacing="2" fill="#8A5CD1">PAENG SAETBYEOL</text></svg>`;
}
const won=n=>n.toLocaleString('ko-KR')+'원';
const id=+(new URLSearchParams(location.search).get('id')||1);
const b=books.find(x=>x.id===id)||books[0];
document.title=b.title+" · 팽샛별";
const cover=b.image?`<img src="${b.image}" alt="${b.title} 표지">`:coverSVG(b);
document.getElementById('detail').innerHTML=`
  <div class="coverbox">${cover}</div>
  <div>
    <span class="series">${b.series}</span>
    <h1>${b.title}</h1>
    <div class="price">${won(b.price)}</div>
    <p class="blurb">${b.blurb}</p>
    <div class="facts">
      <div><span class="k">지은이</span><span>팽샛별 (${b.role})</span></div>
      <div><span class="k">출판사</span><span>${b.publisher}</span></div>
      <div><span class="k">출간</span><span>${b.date}</span></div>
      <div><span class="k">분량</span><span>${b.pages}</span></div>
    </div>
    <div class="buys">
      <button class="btn buy" onclick="alert('예시 화면입니다 — 실제 결제는 제공되지 않아요.')">바로 구매</button>
      <button class="btn cart" onclick="alert('장바구니에 담았습니다 (예시).')">장바구니</button>
    </div>
    <p class="note">※ 예시용 상점입니다. 결제·배송 기능은 포함되어 있지 않습니다.</p>
    <a class="back" href="shop.html">← 다른 책 보기</a>
  </div>`;
</script>
</body>
</html>
