<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>도서 상세 · 팽샛별</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#FCFBF7; --paper-2:#F3F0E6; --ink:#201E1A; --ink-soft:#6B6963; --line:rgba(32,30,26,.12);
    --coral:#F2543D; --yellow:#F6BE2C; --green:#54B24A; --magenta:#E94E9C; --teal:#2FB3A6; --purple:#8A5CD1;
    --radius:16px;
    --display:"Space Grotesk","Pretendard Variable",Pretendard,-apple-system,sans-serif;
    --body:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--body); line-height:1.7;
    -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a{ color:inherit; text-decoration:none; } img{ max-width:100%; display:block; }
  .wrap{ width:min(1120px,92vw); margin-inline:auto; }
  a:focus-visible,button:focus-visible{ outline:3px solid var(--purple); outline-offset:3px; border-radius:6px; }

  header{ position:fixed; inset:0 0 auto 0; z-index:50; display:flex; align-items:center; gap:20px;
    padding:18px min(4vw,34px); transition:background .35s,backdrop-filter .35s,border-color .35s; border-bottom:1px solid transparent; }
  header.solid{ background:color-mix(in srgb,var(--paper) 84%,transparent); backdrop-filter:blur(9px); border-bottom-color:var(--line); }
  .brand{ display:flex; align-items:center; gap:22px; font-weight:800; font-size:1.05rem; }
  .brand .dot{ width:12px; height:12px; border-radius:50%; background:var(--coral); box-shadow:16px 0 0 var(--yellow),-16px 0 0 var(--teal); }
  .nav{ margin-left:auto; display:flex; align-items:center; gap:22px; font-size:.9rem; color:var(--ink-soft); }
  .nav a{ transition:color .2s; } .nav a:hover{ color:var(--ink); }
  .nav a.active{ color:var(--ink); font-weight:800; }
  .nav .pill{ border:1.6px solid var(--ink); color:var(--ink); border-radius:999px; padding:6px 15px; font-weight:800; font-size:.78rem; letter-spacing:.08em; transition:background .2s,color .2s; }
  .nav .pill:hover{ background:var(--ink); color:#fff; }
  .navbtn{ display:none; margin-left:auto; background:none; border:0; cursor:pointer; font-family:inherit; font-weight:800; font-size:.9rem; color:var(--ink); padding:8px; }
  @media (max-width:860px){
    .nav{ position:fixed; inset:64px 0 auto 0; flex-direction:column; align-items:flex-start; gap:4px; padding:18px min(6vw,34px) 26px;
      background:var(--paper); border-bottom:1px solid var(--line); transform:translateY(-14px); opacity:0; pointer-events:none; transition:opacity .25s,transform .25s; font-size:1.05rem; }
    .nav.open{ opacity:1; transform:none; pointer-events:auto; }
    .nav a{ padding:9px 0; } .nav .pill{ margin-top:6px; } .navbtn{ display:block; }
  }

  .crumb{ padding:128px 0 0; font-size:.92rem; color:var(--ink-soft); font-weight:700; }
  .crumb a:hover{ color:var(--coral); }
  .detail{ display:grid; grid-template-columns:.82fr 1.18fr; gap:56px; padding:28px 0 0; align-items:start; }
  .coverbox{ border-radius:var(--radius); overflow:hidden; border:2px solid var(--ink); box-shadow:16px 16px 0 var(--teal); background:#fff; }
  .coverbox img,.coverbox svg{ width:100%; display:block; }
  .series{ font-size:.8rem; letter-spacing:.02em; color:var(--magenta); font-weight:800; }
  h1.bt{ font-family:var(--body); font-weight:800; font-size:clamp(1.9rem,4.6vw,3.1rem); margin:12px 0 4px; letter-spacing:-.01em; line-height:1.08; }
  .price{ font-size:1.7rem; font-weight:800; margin:20px 0; }
  .blurb{ color:var(--ink-soft); max-width:54ch; }
  .facts{ margin:26px 0; border-top:2px solid var(--ink); }
  .facts div{ display:grid; grid-template-columns:120px 1fr; gap:10px; padding:13px 0; border-bottom:1px solid var(--line); font-size:.94rem; }
  .facts .k{ color:var(--ink-soft); font-weight:700; }
  .buys{ display:flex; gap:12px; margin-top:28px; flex-wrap:wrap; }
  .cta{ cursor:pointer; font-family:inherit; font-weight:800; font-size:1rem; padding:15px 28px; border-radius:999px;
    border:1.8px solid var(--ink); transition:transform .18s,background .2s,color .2s; }
  .cta.fill{ background:var(--ink); color:var(--paper); }
  .cta.fill:hover{ background:var(--coral); border-color:var(--coral); transform:translateY(-2px); }
  .cta.ghost{ background:none; color:var(--ink); }
  .cta.ghost:hover{ background:var(--ink); color:var(--paper); transform:translateY(-2px); }
  .note{ margin-top:18px; font-size:.84rem; color:var(--ink-soft); }
  .back{ display:inline-block; margin-top:12px; font-weight:800; }
  .back:hover{ color:var(--coral); }
  @media (max-width:820px){ .detail{ grid-template-columns:1fr; gap:32px; } .coverbox{ max-width:340px; margin-inline:auto; box-shadow:12px 12px 0 var(--teal); } }

  footer{ border-top:1px solid var(--line); padding:44px min(4vw,34px); display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap; color:var(--ink-soft); font-size:.86rem; margin-top:clamp(80px,12vw,140px); }
  footer .fbrand{ display:flex; align-items:center; gap:22px; font-weight:800; color:var(--ink); }
  footer .fbrand .dot{ width:10px; height:10px; border-radius:50%; background:var(--magenta); box-shadow:14px 0 0 var(--green),-14px 0 0 var(--yellow); }
</style>
</head>

<body>
<script>document.documentElement.classList.add('js');</script>

<header id="topbar">
  <a class="brand" href="index.html"><span class="dot"></span>팽샛별</a>
  <button class="navbtn" id="navbtn" aria-expanded="false" aria-controls="nav">메뉴</button>
  <nav class="nav" id="nav">
    <a href="intro.html">소개</a>
    <a href="shop.html" class="active">그림책</a>
    <a href="index.html#video">작업 영상</a>
    <a href="edu.html">활동</a>
    <a href="index.html#contact">문의</a>
    <a href="shop.html" class="pill">SHOP</a>
    <a href="edu.html" class="pill">EDU</a>
  </nav>
</header>

<main class="wrap">
  <p class="crumb"><a href="shop.html">← 상점으로</a></p>
  <div class="detail" id="detail"><!-- JS로 채워집니다 --></div>
</main>

<footer>
  <span class="fbrand"><span class="dot"></span>팽샛별 · saetbyeol paeng</span>
  <span>© 팽샛별 · 예시용 상세 페이지입니다. 실제 결제는 제공되지 않습니다.</span>
</footer>

<script>
const books=[
  {id:1,title:"여보세요?",series:"우리 동네 사람들 이야기",role:"글 · 그림",publisher:"위즈덤하우스",date:"2017. 11. 30.",pages:"48쪽",price:15000,image:"images/covers/hello.jpg",
   blurb:"실 전화기 너머로 이어지는 우리 동네 사람들의 다정한 안부. 서로를 살피는 마음을 노랑노랑한 색으로 그린 팽샛별의 첫 그림책입니다. 종이컵 두 개와 실 한 가닥이 이어 준 하루의 대화를 따라가다 보면, 이웃이라는 말이 조금 더 따뜻해집니다."},
  {id:2,title:"어떡하지?",series:"뚝딱뚝딱 우리책 7",role:"글 · 그림",publisher:"그림책공작소",date:"2017. 12. 26.",pages:"40쪽",price:14000,image:"images/covers/whatnow.jpg",
   blurb:"복도에서 뛸까 말까, 인사할까 말까 — 매일 새로운 고민 앞에 선 고은이. 망설임 끝에 스스로 결정하고 그 결정을 책임지는 아이의 하루를 담았습니다."},
  {id:3,title:"힘도 무선전송된다",series:"열린어린이 동시집 02",role:"그림",publisher:"열린어린이",date:"2016",pages:"128쪽",price:12000,image:"images/covers/power.jpg",
   blurb:"이중현 시인의 동시에 팽샛별이 그림을 얹었습니다. 운동장과 교실, 아이들의 씩씩한 하루가 통통 튀는 그림과 함께 펼쳐집니다."},
  {id:4,title:"실 전화기",series:"팽샛별 그림책",role:"글 · 그림",publisher:"(예시) 샛별책방",date:"2025",pages:"44쪽",price:15000,color:"var(--coral)",pat:"dots",
   blurb:"창과 창 사이를 잇는 노란 실 한 가닥. 멀리 있어도 마음은 이어진다는, 작고 따뜻한 이야기입니다. ※ 실제 출간물이 아닌 예시 도서입니다."},
  {id:5,title:"바느질하는 밤",series:"팽샛별 그림책",role:"글 · 그림",publisher:"(예시) 샛별책방",date:"2025",pages:"48쪽",price:16000,color:"var(--teal)",pat:"stripe",
   blurb:"엄마의 반짇고리에서 시작된 한밤의 모험. 단추와 실, 골무가 도란도란 이야기를 잇습니다. ※ 실제 출간물이 아닌 예시 도서입니다."},
  {id:6,title:"단추 마을",series:"팽샛별 그림책",role:"글 · 그림",publisher:"(예시) 샛별책방",date:"2025",pages:"40쪽",price:15000,color:"var(--magenta)",pat:"grid",
   blurb:"동그란 단추들이 사는 마을에 구멍 세 개짜리 낯선 단추가 찾아옵니다. 다름과 어울림에 대한 그림책. ※ 실제 출간물이 아닌 예시 도서입니다."},
];
function coverSVG(b){
  const pat = b.pat==='stripe'
    ? `<pattern id="p${b.id}" patternUnits="userSpaceOnUse" width="26" height="26" patternTransform="rotate(45)"><rect width="26" height="26" fill="${b.color}"/><rect width="13" height="26" fill="#ffffff33"/></pattern>`
    : b.pat==='grid'
    ? `<pattern id="p${b.id}" patternUnits="userSpaceOnUse" width="24" height="24"><rect width="24" height="24" fill="${b.color}"/><path d="M0 0H24M0 0V24" stroke="#ffffff44" stroke-width="2"/></pattern>`
    : `<pattern id="p${b.id}" patternUnits="userSpaceOnUse" width="26" height="26"><rect width="26" height="26" fill="${b.color}"/><circle cx="7" cy="7" r="3.4" fill="#ffffff55"/><circle cx="19" cy="19" r="3.4" fill="#ffffff55"/></pattern>`;
  return `<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg"><defs>${pat}</defs>
    <rect width="300" height="400" fill="url(#p${b.id})"/>
    <rect x="22" y="150" width="256" height="120" rx="10" fill="#ffffffee"/>
    <text x="150" y="205" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="30" font-weight="800" fill="#201E1A">${b.title}</text>
    <text x="150" y="240" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="13" letter-spacing="2" fill="#8A5CD1">saetbyeol paeng</text></svg>`;
}
const won=n=>n.toLocaleString('ko-KR')+'원';
const id=+(new URLSearchParams(location.search).get('id')||1);
const b=books.find(x=>x.id===id)||books[0];
document.title=b.title+" · 팽샛별";
const cover=b.image?`<img src="${b.image}" alt="${b.title} 표지">`:coverSVG(b);
document.getElementById('detail').innerHTML=`
  <div class="coverbox">${cover}</div>
  <div>
    <span class="series">${b.series}</span>
    <h1 class="bt">${b.title}</h1>
    <div class="price">${won(b.price)}</div>
    <p class="blurb">${b.blurb}</p>
    <div class="facts">
      <div><span class="k">지은이</span><span>팽샛별 (${b.role})</span></div>
      <div><span class="k">출판사</span><span>${b.publisher}</span></div>
      <div><span class="k">출간</span><span>${b.date}</span></div>
      <div><span class="k">분량</span><span>${b.pages}</span></div>
    </div>
    <div class="buys">
      <button class="cta fill" onclick="alert('예시 화면입니다 — 실제 결제는 제공되지 않아요.')">바로 구매</button>
      <button class="cta ghost" onclick="alert('장바구니에 담았습니다 (예시).')">장바구니</button>
    </div>
    <p class="note">※ 예시용 상점입니다. 결제·배송 기능은 포함되어 있지 않습니다.</p>
    <a class="back" href="shop.html">← 다른 책 보기</a>
  </div>`;

/* header + nav */
const bar=document.getElementById('topbar');
addEventListener('scroll',()=>bar.classList.toggle('solid',scrollY>40),{passive:true});
const navbtn=document.getElementById('navbtn'),nav=document.getElementById('nav');
navbtn.addEventListener('click',()=>{const o=nav.classList.toggle('open');navbtn.setAttribute('aria-expanded',o);});
</script>
</body>
</html>
